# hyprlock 配置 - 2.5K 屏适配

general {
  grace = 0
  disable_loading_bar = true
}

background {
  monitor =
  path = /home/eternity/Pictures/Image_1777541053459_272..jpg
  blur_passes = 3
  blur_size = 8
  brightness = 0.6
  contrast = 1.2
  vibrancy = 0.3
  vibrancy_darkness = 0.2
}

# 时间
label {
  text = cmd[update:1000] date +"%H:%M"
  font_size = 72
  font_family = "Noto Sans CJK SC"
  color = rgba(255, 255, 255, 0.9)
  position = 0, 200
  halign = center
  valign = top
}

# 日期
label {
  text = cmd[update:3600000] date +"%A %Y-%m-%d"
  font_size = 20
  font_family = "Noto Sans CJK SC"
  color = rgba(255, 255, 255, 0.6)
  position = 0, 330
  halign = center
  valign = top
}

# 用户名
label {
  text = "$USER"
  font_size = 22
  font_family = "Noto Sans CJK SC Bold"
  color = rgba(194, 24, 140, 1.0)
  position = 0, -50
  halign = center
  valign = center
}

# 密码输入框
input-field {
  size = 320, 50
  outline_thickness = 2
  dots_size = 0.28
  dots_spacing = 0.15
  outer_color = rgba(194, 24, 140, 0.5)
  inner_color = rgba(0, 0, 0, 0.4)
  font_color = rgba(255, 255, 255, 0.9)
  font_family = "Noto Sans CJK SC"
  font_size = 18
  placeholder_text = "输入密码..."
  fade_on_empty = true
  halign = center
  valign = center
  position = 0, 50
  round_border = true
}

# 登录提示
label {
  text = $FAIL
  color = rgba(255, 100, 100, 0.9)
  font_size = 16
  font_family = "Noto Sans CJK SC"
  timeout_mili = 3000
  position = 0, 150
  halign = center
  valign = center
}

# 提示文字
label {
  text = "按 Enter 解锁，按 Esc 退出"
  font_size = 14
  font_family = "Noto Sans CJK SC"
  color = rgba(255, 255, 255, 0.4)
  position = 0, -50
  halign = center
  valign = bottom
}
